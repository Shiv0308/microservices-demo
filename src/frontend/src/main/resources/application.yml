spring:
  application:
    name: frontend
  thymeleaf:
    cache: true
    encoding: UTF-8

server:
  port: ${PORT:8080}
  address: ${LISTEN_ADDR:0.0.0.0}
  servlet:
    context-path: ${BASE_URL:}
  tomcat:
    basedir: /tmp
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      pattern: common

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

replay:
  logging:
    enabled: ${REPLAY_LOGGING_ENABLED:true}
    max-payload: ${REPLAY_LOGGING_MAX_PAYLOAD:10000}
    include-response: ${REPLAY_LOGGING_INCLUDE_RESPONSE:false}
    skip-paths:
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /swagger.json
      - /swagger/**
      - /static/**
      - /_healthz
      - /robots.txt
